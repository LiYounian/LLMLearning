# 参考模板：拷到 /etc/nginx/conf.d/llmlearning.conf（或 sites-available 并做软链）
# 职责：把仓库目录当静态站托管在 9501 端口。改了文件即生效，无需重启 nginx（reload 亦可）。
server {
    listen 9501;
    listen [::]:9501;
    server_name _;

    # 本项目实际 clone 路径（家目录下，需给 /home/admin 加 o+x 让 nginx 可穿越）
    root /home/admin/LLMLearning;
    index index.html;

    # 中文目录名/文件名需要 UTF-8，否则部分浏览器/头部乱码
    charset utf-8;

    # 访问目录时优先找 index.html，找不到再 404（不开目录列表）
    location / {
        try_files $uri $uri/ =404;
    }

    # 静态资源给个短缓存（HTML 不缓存，保证推送后尽快见到新内容）
    location ~* \.(css|js|json|png|jpg|jpeg|svg|woff2?)$ {
        expires 10m;
        add_header Cache-Control "public";
    }
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }

    access_log /var/log/nginx/llmlearning.access.log;
    error_log  /var/log/nginx/llmlearning.error.log;
}
